<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Porey</title>
<link rel="icon" href="logo-mark.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Hind+Siliguri:wght@400;500&display=swap">
<style>
:root{
  --bg:#ECE8D9;--surface:#F7F4EA;--surface2:#E2DDCB;--ink:#22302A;--muted:#5F6B61;--line:#D6D0BC;
  --pine:#2D4033;--on-pine:#F3EFE2;--sage:#A9B99C;--sage-soft:#D3DCC8;--accent:#E0502F;--accent-soft:#F6D5CB;
  --good:#2D6A4A;--good-soft:#D7E7D5;--star:#B96F10;
  --display:'Playfair Display',Georgia,serif;--body:'Figtree',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--bnf:'Hind Siliguri','Noto Sans Bengali',sans-serif;
  color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding:0 16px 120px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.bn{font-family:var(--bnf);font-size:.92em;color:var(--accent);margin-left:.35em}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h2{font-size:1.9rem;line-height:1.1}
.sub{color:var(--muted);margin:4px 0 0}
.mono{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
header{position:sticky;top:0;z-index:9;background:var(--bg);padding:14px 0 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1080px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto;min-width:0}
.mark{width:52px;height:52px;border-radius:50%;background:var(--sage);flex:none;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:cover;display:block}
.brand{font-family:var(--display);font-size:2rem;line-height:1}
.brand .bn{font-size:1rem;vertical-align:top}
.tag{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;color:var(--muted);display:block;text-transform:uppercase}
.chip-btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:99px;padding:10px 14px;background:var(--surface2);font-size:.85rem}
.role{border:1px solid var(--line);background:var(--sage-soft);border-radius:99px;padding:10px 14px;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;display:inline-flex;align-items:center;gap:7px;text-decoration:none;max-width:200px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.role::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.role.guest::before{background:var(--muted)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;z-index:9;width:min(560px,calc(100% - 20px));display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:8px;box-shadow:0 8px 28px rgb(0 0 0/.12)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:20px;text-decoration:none;font-size:.74rem;color:var(--muted);position:relative}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
nav.tabs a[aria-current="page"] svg{color:var(--accent)}
.cnt{position:absolute;top:2px;right:22%;background:var(--accent);color:#fff;border-radius:99px;font-size:.65rem;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.hero{position:relative;border-radius:28px;overflow:hidden;min-height:340px;display:flex;flex-direction:column;justify-content:flex-end;padding:24px;color:#fff;box-shadow:0 10px 30px rgb(0 0 0/.15)}
.hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgb(20 14 10/.78),rgb(20 14 10/.05) 70%)}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.05;max-width:14ch;margin:10px 0 18px}
.pill-red{align-self:flex-start;background:var(--accent);color:#fff;border-radius:99px;padding:7px 14px;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em}
.pill-red .bn{color:#fff}
.hero-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;padding:14px 22px;background:var(--pine);color:var(--on-pine);font-weight:500;text-decoration:none}
.btn.light{background:#F7F4EA;color:#22302A}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.sm{padding:9px 16px;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:99px;padding:11px 20px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--pine);color:var(--on-pine);border-color:var(--pine)}
.brandchip{flex:none;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:14px 22px;font-size:1.05rem}
.brandchip svg{color:var(--good)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.link{color:var(--accent);background:none;border:0;padding:6px 0;font-size:1rem;text-decoration:none}
.rail{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}
.rail .card{flex:none;width:min(300px,78vw);scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;position:relative;display:flex;flex-direction:column;min-width:0;box-shadow:0 2px 10px rgb(0 0 0/.05)}
.card .ph{display:block;border:0;padding:0;background:none;width:100%;text-align:left}
.card .ph svg,.card .ph img{display:block;width:100%;aspect-ratio:200/230;height:auto;object-fit:cover}
.badge{position:absolute;top:12px;left:12px;z-index:2;border-radius:99px;padding:5px 11px;font-family:var(--mono);font-size:.68rem;background:var(--pine);color:var(--on-pine)}
.badge.offer{background:var(--accent);color:#fff}
.heart,.editbtn{position:absolute;top:10px;right:10px;z-index:2;width:42px;height:42px;border-radius:50%;border:0;background:rgb(247 244 234/.94);color:#22302A;display:grid;place-items:center}
.editbtn{top:58px}
.heart[aria-pressed="true"]{color:var(--accent)}
.heart[aria-pressed="true"] svg{fill:currentColor}
.info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand-l{color:var(--muted)}
.star{color:var(--star);font-size:.9rem}
.pname{font-size:1.08rem;line-height:1.25;background:none;border:0;padding:0;text-align:left;font-family:var(--display)}
.price{font-size:1.1rem}
.price s{color:var(--muted);font-size:.9rem;margin-left:6px}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.meta svg{width:16px;height:16px;color:var(--good)}
.stock{background:var(--good-soft);color:var(--good);border-radius:99px;padding:3px 11px;font-family:var(--mono);font-size:.7rem}
.stock.low{background:var(--accent-soft);color:var(--accent)}
.offer-box{background:var(--accent-soft);border:1px solid var(--accent);border-radius:22px;padding:20px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.offer-box h3{font-size:1.3rem}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.note p{margin:8px 0 0}
.about{background:var(--surface2);border-radius:22px;padding:20px;color:var(--muted);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.about img{width:96px;height:96px;border-radius:50%}
.about strong{display:block;color:var(--ink);font-weight:500;font-size:1.05rem;margin-bottom:6px}
.searchrow{display:flex;gap:12px}
.search{flex:1;display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:20px;padding:0 16px;background:var(--bg);min-width:0}
.search input{flex:1;border:0;background:none;color:var(--ink);font:inherit;padding:16px 0;min-width:0;outline:none}
.search:focus-within{border-color:var(--accent)}
.filter-btn{width:60px;border:0;border-radius:18px;background:var(--surface2);display:grid;place-items:center}
select,input.f,textarea.f{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
textarea.f{min-height:96px;resize:vertical}
input[type=color]{padding:2px;height:46px}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:34px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:560px;margin:40px auto}
.empty .circ{width:84px;height:84px;border-radius:50%;background:var(--sage-soft);display:grid;place-items:center}
.empty p{color:var(--muted);margin:0}
.two{display:grid;grid-template-columns:1fr;gap:20px}
@media (min-width:860px){.two{grid-template-columns:1.4fr 1fr;align-items:start}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
details.panel>summary{cursor:pointer;font-family:var(--display);font-size:1.3rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::after{content:"+";font-family:var(--body);font-size:1.4rem;color:var(--accent)}
details.panel[open]>summary::after{content:"\2212"}
.line-item{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center}
.th{width:76px;height:88px;border-radius:14px;overflow:hidden;background:var(--surface2)}
.th svg,.th img{width:100%;height:100%;object-fit:cover;display:block}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px}
.qty button{border:0;background:none;width:36px;height:36px;font-size:1.1rem}
.sumrow{display:flex;justify-content:space-between;gap:10px}
.sumrow.total{font-size:1.2rem;border-top:1px solid var(--line);padding-top:12px}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.opt:has(input:checked){border-color:var(--pine);background:var(--sage-soft)}
label.lab{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted)}
form.stack{display:flex;flex-direction:column;gap:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.order{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.order h3{font-size:1.5rem}
.grp{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.status{background:var(--good-soft);color:var(--good);border-radius:99px;padding:6px 12px;font-family:var(--mono);font-size:.72rem}
.status.bad{background:var(--accent-soft);color:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center}
.steps div{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--mono);font-size:.62rem;color:var(--muted);min-width:0}
.dot{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
.dot svg{width:16px;height:16px}
.steps .done .dot{background:var(--pine);color:var(--on-pine)}
.steps .done{color:var(--ink)}
.profile{display:flex;gap:16px;align-items:center}
.avatar{width:76px;height:76px;border-radius:20px;background:var(--sage-soft);display:grid;place-items:center;flex:none}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch>span{display:flex;align-items:center;gap:12px}
.tg{width:60px;height:34px;border-radius:99px;border:2px solid var(--line);background:var(--surface2);position:relative;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .2s}
.tg[aria-checked="true"]{background:var(--pine);border-color:var(--pine)}
.tg[aria-checked="true"]::after{transform:translateX(26px);background:var(--on-pine)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface2);border-radius:16px;padding:14px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:1.5rem}
.caps{margin:0;padding-left:18px;color:var(--muted)}
.trow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.trow .th{width:52px;height:60px;border-radius:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.preview{display:block;max-width:160px;border-radius:14px;background:var(--surface2)}
.preview.wide{max-width:260px}
.err{color:var(--accent);margin:0;min-height:1.2em;font-size:.9rem}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:99px;padding:4px}
.seg button{border:0;background:none;border-radius:99px;padding:10px}
.seg button[aria-pressed="true"]{background:var(--pine);color:var(--on-pine)}
.logo-full{width:120px;height:120px;border-radius:50%}
#shopf{display:none}
.auth:has(input[value=shop]:checked) #shopf{display:flex}
#sheetbg{position:fixed;inset:0;background:rgb(0 0 0/.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet{background:var(--bg);width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
#sheet .big svg,#sheet .big img{width:100%;height:auto;max-height:340px;border-radius:20px;display:block;object-fit:cover}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.size{border:1px solid var(--line);background:transparent;border-radius:12px;min-width:48px;padding:10px 14px}
.size[aria-pressed="true"]{background:var(--pine);color:var(--on-pine);border-color:var(--pine)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:30;background:var(--pine);color:var(--on-pine);border-radius:99px;padding:12px 20px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

function findOrder(id){return db.orders.filter(function(o){return o.id===id})[0]}

function place(){
 var u=U();
 if(!u){openSheet({t:'auth',tab:'login',note:'Log in or sign up to place your order. Your bag is saved.'});return}
 if(role()!=='customer'){toast('Switch to a customer account to place orders');return}
 var co=S.co;
 if(!co.name.trim()||digits(co.phone).length<8||!co.addr.trim()){toast('Add your name, phone and delivery address');return}
 for(var k=0;k<ui.bag.length;k++){var it=ui.bag[k],pp=prod(it.id);if(!pp||pp.stock<it.q){toast((pp?pp.name:'An item')+' is no longer in stock in that quantity');return}}
 var c=calc(),groups={};
 ui.bag.forEach(function(i){var p=prod(i.id);(groups[p.brand]=groups[p.brand]||[]).push({pid:p.id,name:p.name,sz:i.sz,q:i.q,price:p.price});p.stock-=i.q});
 var at=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Dhaka',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:true}).format(new Date()).replace(/^(\d{2} \w{3}),? /,'$1, ').toUpperCase()+' BDT';
 db.orders.unshift({id:'PRY-'+Math.floor(100000+Math.random()*900000),uid:u.id,name:co.name.trim(),phone:co.phone.trim(),addr:co.addr.trim(),area:co.area,pay:S.pay,at:at,total:c.total,groups:Object.keys(groups).map(function(m){return {m:m,step:0,cancelled:false,items:groups[m]}})});
 if(!save())return;
 ui.bag=[];saveUI();S.promo='';S.co.addr='';toast('Order placed. Stock reserved with each merchant.');location.hash='#orders'
}
function act(a,d){
 var u=U(),o,g;
 switch(a){
 case 'open':{var p=prod(+d.id);openSheet({t:'prod',id:+d.id,sz:p.sizes[0]});break}
 case 'close':closeSheet();break;
 case 'size':S.sheet.sz=d.s;drawSheet();break;
 case 'fav':{var i=ui.favs.indexOf(+d.id);if(i>-1)ui.favs.splice(i,1);else ui.favs.push(+d.id);saveUI();if(S.sheet&&S.sheet.t==='prod')drawSheet();render();break}
 case 'add':{var q=prod(+d.id),ex=ui.bag.filter(function(x){return x.id===q.id&&x.sz===S.sheet.sz})[0],have=ex?ex.q:0;if(have+1>q.stock){toast('Only '+q.stock+' in stock');break}if(ex)ex.q++;else ui.bag.push({id:q.id,sz:S.sheet.sz,q:1});saveUI();closeSheet();chrome();toast('Added to your bag');break}
 case 'shopcat':S.cat=d.c;S.q='';S.brand='';location.hash='#discover';break;
 case 'cat':S.cat=d.c;render();break;
 case 'offers':S.cat='Offers';S.brand='';location.hash='#discover';break;
 case 'brand':S.brand=d.b;S.cat='All';S.q='';S.filt=true;location.hash='#discover';break;
 case 'savedview':S.cat='Saved';location.hash='#discover';break;
 case 'filt':S.filt=!S.filt;render();break;
 case 'inc':{var it=ui.bag[+d.i],pr=prod(it.id);if(it.q+1>pr.stock)toast('Only '+pr.stock+' in stock');else it.q++;saveUI();render();break}
 case 'dec':{var t=ui.bag[+d.i];if(t.q>1)t.q--;else ui.bag.splice(+d.i,1);saveUI();render();break}
 case 'rm':ui.bag.splice(+d.i,1);saveUI();render();break;
 case 'promo':{var v=$('#promo').value.trim().toUpperCase(),ok=!v||db.site.promos.some(function(x){return x.code===v});if(ok){S.promo=v;toast(v?'Promo '+v+' applied':'Promo removed')}else toast('That code is not valid');render();break}
 case 'place':place();break;
 case 'cancel':o=findOrder(d.o);g=o.groups[+d.g];g.cancelled=true;g.reason='Cancelled by you';release(g);save();render();toast('Order cancelled and stock released');break;
 case 'decline':o=findOrder(d.o);g=o.groups[+d.g];g.cancelled=true;g.reason='Declined by merchant';release(g);save();render();break;
 case 'adv':o=findOrder(d.o);g=o.groups[+d.g];g.step=Math.min(5,g.step+1);save();render();break;
 case 'ret':o=findOrder(d.o);o.groups[+d.g].returned='requested';save();render();toast('Return request sent to the merchant');break;
 case 'retok':o=findOrder(d.o);g=o.groups[+d.g];g.returned='approved';release(g);save();render();toast('Return approved. Stock restored.');break;
 case 'bn':ui.bn=!ui.bn;saveUI();render();break;
 case 'signout':ui.sess=null;saveUI();render();toast('Signed out. Browsing as guest.');break;
 case 'authopen':openSheet({t:'auth',tab:'login'});break;
 case 'signupopen':openSheet({t:'auth',tab:'signup'});break;
 case 'tab':S.sheet.tab=d.t;drawSheet();break;
 case 'guest':closeSheet();toast('Browsing as guest');break;
 case 'pedit':if(d.id&&!canEdit(prod(+d.id)))break;openSheet({t:'pedit',id:d.id?+d.id:null});break;
 case 'pdel':if(confirm('Delete this product? This cannot be undone.')){db.products=db.products.filter(function(x){return x.id!==+d.id});ui.bag=ui.bag.filter(function(x){return x.id!==+d.id});saveUI();save();render()}break;
 case 'pimgrm':S.draft.img='';$('#pprev').innerHTML='<span class="sub" style="font-size:.85rem">No photo. A drawing is used instead.</span>';break;
 case 'resetimg':db.site[d.k]=DEF.site[d.k];save();render();break;
 case 'deluser':if(confirm('Remove this user?')){db.users=db.users.filter(function(x){return x.id!==d.id});save();render()}break;
 case 'export':db.seed=Date.now();save();download('porey-data.json',{version:db.seed,site:db.site,products:db.products});toast('Saved. Put this file next to index.html.');break;
 case 'backup':download('porey-backup.json',{version:Date.now(),site:db.site,products:db.products,users:db.users,orders:db.orders});break;
 case 'demorm':db.products=db.products.filter(function(x){return !x.demo});save();render();toast('Demo products removed');break;
 case 'reset':if(confirm('Erase all products, users and orders on this device and start fresh?')){localStorage.removeItem(KEY);localStorage.removeItem(UIK);load();S.promo='';render();toast('Reset done')}break;
 }
}
function submitForm(f){
 var a=f.dataset.a,fd=new FormData(f),g=function(k){return String(fd.get(k)==null?'':fd.get(k)).trim()};
 if(a==='login'){
  var idv=g('id').toLowerCase(),ph=digits(idv);
  hash(g('pw')).then(function(h){var us=db.users.filter(function(x){return (x.email.toLowerCase()===idv||(ph.length>=8&&digits(x.phone)===ph))&&x.pass===h})[0];
   if(us)login(us);else msg(f,'No account matches that email/phone and password.')});
 }else if(a==='signup'){
  var r=g('role'),em=g('email').toLowerCase(),phn=g('phone');
  if(r==='owner'&&(!S.setup||db.users.some(function(x){return x.role==='owner'}))){msg(f,'The owner account already exists.');return}
  if(g('name').length<2)return msg(f,'Enter your name.');
  if(digits(phn).length<8)return msg(f,'Enter a valid phone number.');
  if(!/^\S+@\S+\.\S+$/.test(em))return msg(f,'Enter a valid email.');
  if(g('pw').length<6)return msg(f,'Password must be 6 or more characters.');
  if(r==='shop'&&g('shopName').length<2)return msg(f,'Enter your shop name.');
  if(db.users.some(function(x){return x.email.toLowerCase()===em||digits(x.phone)===digits(phn)}))return msg(f,'That email or phone is already registered. Log in instead.');
  hash(g('pw')).then(function(h){var nu={id:'u'+Date.now().toString(36)+Math.floor(Math.random()*1e4),role:r,name:g('name'),phone:phn,email:em,pass:h,shopName:r==='shop'?g('shopName'):''};db.users.push(nu);if(save())login(nu)});
 }else if(a==='profile'){
  var u=U(),em2=g('email').toLowerCase();
  if(g('name').length<2||digits(g('phone')).length<8||!/^\S+@\S+\.\S+$/.test(em2))return msg(f,'Check your name, phone and email.');
  if(db.users.some(function(x){return x.id!==u.id&&(x.email.toLowerCase()===em2||digits(x.phone)===digits(g('phone')))}))return msg(f,'Another account uses that email or phone.');
  u.name=g('name');u.phone=g('phone');u.email=em2;
  if(u.role==='shop'&&g('shopName')&&g('shopName')!==u.shopName){var oldName=u.shopName;u.shopName=g('shopName');db.products.forEach(function(p){if(p.own===u.id)p.brand=u.shopName});db.orders.forEach(function(od){od.groups.forEach(function(gr){if(gr.m===oldName)gr.m=u.shopName})})}
  save();render();toast('Details saved')
 }else if(a==='pw'){
  var uu=U();
  if(g('neu').length<6)return msg(f,'New password must be 6 or more characters.');
  hash(g('old')).then(function(h){if(h!==uu.pass)return msg(f,'Current password is not right.');return hash(g('neu')).then(function(n){uu.pass=n;save();f.reset();msg(f,'');toast('Password changed')})})
 }else if(a==='site'){
  var s=db.site;
  fd.forEach(function(v,k){
   v=String(v);
   if(k==='cats'||k==='areas'){var l=v.split(',').map(function(x){return x.trim()}).filter(Boolean);if(l.length)s[k]=l}
   else if(k==='promos'){s.promos=v.split('\n').map(function(l){var p=l.split('|').map(function(x){return x.trim()});return {code:(p[0]||'').toUpperCase(),type:p[1]==='flat'?'flat':'pct',val:+p[2]||0}}).filter(function(x){return x.code&&x.val>0})}
   else if(k==='feeIn'||k==='feeOut'||k==='freeOver')s[k]=Math.max(0,+v||0);
   else s[k]=v
  });
  if(save()){render();toast('Saved')}
 }else if(a==='pform'){
  var id=f.dataset.id?+f.dataset.id:null,pu=U(),old=id?prod(id):null;
  var price=+g('price'),stock=Math.floor(+g('stock'));
  if(g('name').length<2)return msg(f,'Enter a product name.');
  if(!(price>0))return msg(f,'Enter a price above zero.');
  if(!(stock>=0))return msg(f,'Enter the stock count.');
  var sizes=g('sizes').split(',').map(function(x){return x.trim()}).filter(Boolean);if(!sizes.length)sizes=['Free size'];
  var np={id:old?old.id:db.products.reduce(function(m,x){return Math.max(m,x.id)},0)+1,own:old?old.own:pu.id,demo:0,rating:old?old.rating:0,name:g('name'),brand:role()==='shop'?pu.shopName:(g('brand')||db.site.name),cat:g('cat'),tag:g('tag'),price:price,was:+g('was')||0,stock:stock,area:g('area'),sizes:sizes,shape:g('shape'),col:g('col'),acc:g('acc'),img:S.draft.img||''};
  if(old)Object.assign(old,np);else db.products.push(np);
  if(save()){closeSheet();render();toast(old?'Product updated':'Product added')}
 }
}
document.addEventListener('click',function(e){
 if(e.target.id==='sheetbg'){closeSheet();return}
 var b=e.target.closest('[data-a]');if(!b||b.tagName==='FORM')return;
 act(b.dataset.a,b.dataset)
});
document.addEventListener('submit',function(e){e.preventDefault();submitForm(e.target)});
document.addEventListener('input',function(e){
 var t=e.target;
 if(t.id==='q'){S.q=t.value;var g=gridParts();$('#count').textContent=g.c;$('#grid').innerHTML=g.h}
 if(t.dataset&&t.dataset.co)S.co[t.dataset.co]=t.value
});
document.addEventListener('change',function(e){
 var t=e.target;
 if(t.id==='sort'){S.sort=t.value;render()}
 else if(t.id==='brandsel'){S.brand=t.value;render()}
 else if(t.id==='area'){S.co.area=t.value;render()}
 else if(t.name==='pay'&&t.type==='radio'&&!t.closest('form')){S.pay=t.value}
 else if(t.dataset&&t.dataset.img){var k=t.dataset.img,f=t.files[0];if(f)readImg(f,k==='heroImg'?1200:k==='mark'?200:480,k==='heroImg'?'image/jpeg':'image/png',function(url){db.site[k]=url;if(save()){render();toast('Picture updated')}})}
 else if(t.id==='pimg'){var f2=t.files[0];if(f2)readImg(f2,700,'image/jpeg',function(url){S.draft.img=url;$('#pprev').innerHTML='<img class="preview" src="'+url+'" alt="">'})}
 else if(t.id==='restore'){var f3=t.files[0];if(!f3)return;var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);if(!j.site&&!j.products)throw 0;if(j.site)db.site=Object.assign({},clone(DEF.site),j.site);if(j.products)db.products=j.products;if(j.users)db.users=j.users;if(j.orders)db.orders=j.orders;db.seed=j.version||db.seed;if(save()){render();toast('Restored')}}catch(x){toast('That file is not a Porey backup')}};r.readAsText(f3)}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
window.addEventListener('hashchange',route);

/* published edits: pick up porey-data.json when it is newer than this device's copy */
try{if(location.protocol!=='file:')fetch('porey-data.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){
 if(j&&j.version&&j.version>db.seed){db.site=Object.assign({},clone(DEF.site),j.site||{});if(j.products)db.products=j.products;db.seed=j.version;save();render()}
}).catch(function(){})}catch(e){}

route();
})();
